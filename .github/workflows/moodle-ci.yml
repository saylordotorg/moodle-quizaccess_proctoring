name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # Environment-independent checks run exactly once: their result is identical on every
  # Moodle/PHP/DB combination, so repeating them across the PHPUnit matrix is pure waste.
  static:
    name: Static checks (lint / validate / savepoints / mustache / codechecker)
    runs-on: ubuntu-22.04

    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pgsql, zip, gd, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port=5432 --no-init
        env:
          DB: pgsql
          DB_USER: postgres
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./moodle/public/mod/quiz/accessrule/proctoring

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./moodle/public/mod/quiz/accessrule/proctoring

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./moodle/public/mod/quiz/accessrule/proctoring

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache ./moodle/public/mod/quiz/accessrule/proctoring

      # Informational for now: pre-1.1.28 code carries coding-style debt, so style findings
      # report without blocking the pipeline. Make this blocking once the backlog is cleared.
      - name: Moodle code checker (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci codechecker ./moodle/public/mod/quiz/accessrule/proctoring

  # PHPUnit runs on a trimmed matrix: the production series (405) gets the full database
  # spread; the latest stable series covers the newest PHP; one experimental lane tracks
  # Moodle main for an early compatibility signal. Intermediate Moodle series and middle
  # PHP versions are bracketed by these lanes and add no practical signal.
  test:
    name: PHPUnit Moodle ${{ matrix.version }} / PHP ${{ matrix.php }} / ${{ matrix.dbname }}
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Production series: full database spread.
          - version: '405'
            branch: MOODLE_405_STABLE
            php: '8.1'
            pluginpath: ./moodle/mod/quiz/accessrule/proctoring
            experimental: false
            dbname: MariaDB 10.11
            dbtype: mariadb
            dbimage: mariadb:10.11
            dbport: 3306
            dbuser: root
            dbhealthcmd: mysqladmin ping -uroot
          - version: '405'
            branch: MOODLE_405_STABLE
            php: '8.3'
            pluginpath: ./moodle/mod/quiz/accessrule/proctoring
            experimental: false
            dbname: MySQL 8.4
            dbtype: mysqli
            dbimage: mysql:8.4
            dbport: 3306
            dbuser: root
            dbhealthcmd: mysqladmin ping -uroot
          - version: '405'
            branch: MOODLE_405_STABLE
            php: '8.3'
            pluginpath: ./moodle/mod/quiz/accessrule/proctoring
            experimental: false
            dbname: PostgreSQL 16
            dbtype: pgsql
            dbimage: postgres:16
            dbport: 5432
            dbuser: postgres
            dbhealthcmd: pg_isready -U postgres
          # Latest stable series: min/max supported PHP across two databases.
          - version: '502'
            branch: MOODLE_502_STABLE
            php: '8.3'
            pluginpath: ./moodle/public/mod/quiz/accessrule/proctoring
            experimental: false
            dbname: MySQL 8.4
            dbtype: mysqli
            dbimage: mysql:8.4
            dbport: 3306
            dbuser: root
            dbhealthcmd: mysqladmin ping -uroot
          - version: '502'
            branch: MOODLE_502_STABLE
            php: '8.4'
            pluginpath: ./moodle/public/mod/quiz/accessrule/proctoring
            experimental: false
            dbname: PostgreSQL 16
            dbtype: pgsql
            dbimage: postgres:16
            dbport: 5432
            dbuser: postgres
            dbhealthcmd: pg_isready -U postgres
          # Early compatibility signal against Moodle main; never blocks the pipeline.
          - version: '503 (main)'
            branch: main
            php: '8.4'
            pluginpath: ./moodle/public/mod/quiz/accessrule/proctoring
            experimental: true
            dbname: PostgreSQL 16
            dbtype: pgsql
            dbimage: postgres:16
            dbport: 5432
            dbuser: postgres
            dbhealthcmd: pg_isready -U postgres

    services:
      database:
        image: ${{ matrix.dbimage }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_ROOT_HOST: '%'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
          MARIADB_ROOT_HOST: '%'
        ports:
          - "${{ matrix.dbport }}:${{ matrix.dbport }}"
        options: >-
          --health-cmd="${{ matrix.dbhealthcmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, zip, gd, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port=${{ matrix.dbport }}
        env:
          DB: ${{ matrix.dbtype }}
          DB_USER: ${{ matrix.dbuser }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: PHPUnit
        run: moodle-plugin-ci phpunit ${{ matrix.pluginpath }}
