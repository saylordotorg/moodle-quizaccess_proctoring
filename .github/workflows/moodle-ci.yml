name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }} / PostgreSQL
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: '405'
            branch: MOODLE_405_STABLE
            php: '8.3'
            experimental: false
          - moodle: '500'
            branch: MOODLE_500_STABLE
            php: '8.3'
            experimental: false
          - moodle: '501'
            branch: MOODLE_501_STABLE
            php: '8.3'
            experimental: false
          - moodle: '502'
            branch: MOODLE_502_STABLE
            php: '8.3'
            experimental: false
          # Moodle 5.3 does not have a MOODLE_503_STABLE branch yet.
          # Run the 503 lane against main for early compatibility signal without blocking stable CI.
          - moodle: '503'
            branch: main
            php: '8.3'
            experimental: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./moodle/mod/quiz/accessrule/proctoring

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./moodle/mod/quiz/accessrule/proctoring

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./moodle/mod/quiz/accessrule/proctoring

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache ./moodle/mod/quiz/accessrule/proctoring

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit ./moodle/mod/quiz/accessrule/proctoring
